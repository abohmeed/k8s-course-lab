apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: paths
spec:
  parentRefs:
    - name: course-gw
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /echo
      backendRefs:
        - name: echo
          port: 80
    - backendRefs:
        - name: web
          port: 80
